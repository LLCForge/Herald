# Example: docker compose up -d
# Put secrets (bot tokens, routing keys, ...) in ./herald.env (KEY=value lines,
# never committed) and reference them from the TOML via *_env settings.
services:
  herald:
    image: ghcr.io/llcforge/herald:latest
    # build: .
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file:
      - path: ./herald.env
        required: false
    volumes:
      - ./herald.toml:/etc/herald/herald.toml:ro
      - herald-data:/data
    ports:
      # Metrics + /healthz + /readyz. Bind to loopback; expose deliberately.
      - "127.0.0.1:9898:9898"

volumes:
  herald-data:
